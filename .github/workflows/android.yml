name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Bundle HTML with Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          
          # Siapkan folder web
          mkdir -p www
          cp *.html www/index.html 2>/dev/null || cp index.html www/
          
          # Inisialisasi aplikasi dengan nama "Lifelog"
          npx cap init "Lifelog" com.lifelog.app --web-dir www
          npx cap add android
          
          # Siapkan logo untuk icon dan splash screen
          mkdir -p assets
          # Pastikan nama file gambarnya persis "logo Lifelog.jpg" di repository Anda
          cp "logo Lifelog.jpg" assets/icon.jpg
          cp "logo Lifelog.jpg" assets/splash.jpg
          
          # Generate asset ke project Android
          npx capacitor-assets generate --android
          
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          
          # Hapus dependensi Kotlin ganda yang menyebabkan error
          echo "
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                      exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
                  }
              }
          }
          " >> build.gradle
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lifelog-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
